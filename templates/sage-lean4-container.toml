path = "/usr/local/libexec/qsx-science-check"
mode = "0755"
content = '''#!/bin/sh
set -eu
test "$(id -un)" = agent
test "$(id -u)" -ne 0
cd /workspace/project
work=$(mktemp -d /workspace/project/qsx-science-check.XXXXXX)
trap 'rm -rf "$work"' EXIT HUP INT TERM
cd "$work"
printf '%s\n' 'example (n : Nat) : n + 0 = n := rfl' > Exact.lean
lean -o Exact.olean Exact.lean
test -s Exact.olean
lake init QsxSmoke
lake build
lake exe qsxsmoke | grep -q 'Hello'
printf '%s\n' 'LEAN_PROOF_AND_LAKE_BUILD_PASS'
# Same fixed tool path must work under the unmodified pinned Codex sandbox.
codex -c 'sandbox_mode="workspace-write"' sandbox -- sage -python -c 'import os; from sage.all import ZZ; assert os.geteuid() != 0; assert ZZ(2)**20 == 1048576; print("CODEX_SANDBOX_SAGE_PASS")'
'''

