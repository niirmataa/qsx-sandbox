path = "/usr/local/libexec/qsx-science-client.py"
mode = "0755"
content = '''#!/usr/bin/env python3
"""Non-interactive sage/lean/lake client for the fixed guest-local service."""
import base64
import json
import os
from pathlib import Path
import socket
import sys


def main():
    request = {"tool": Path(sys.argv[0]).name, "argv": sys.argv[1:], "cwd": os.getcwd()}
    encoded = json.dumps(request).encode() + b"\n"
    if len(encoded) > 65536:
        raise SystemExit("science tool arguments exceed 64 KiB")
    with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as connection:
        connection.settimeout(650)
        connection.connect("/run/qsx-science/control.sock")
        connection.sendall(encoded)
        with connection.makefile("rb") as stream:
            for line in stream:
                result = json.loads(line)
                if "output" in result:
                    sys.stdout.buffer.write(base64.b64decode(result["output"], validate=True))
                    sys.stdout.buffer.flush()
                if "error" in result:
                    print(result["error"], file=sys.stderr)
                if "exit_code" in result:
                    raise SystemExit(result["exit_code"])
    raise SystemExit("science service disconnected before reporting an exit status")


if __name__ == "__main__":
    main()
'''

[[files]]
path = "/usr/local/libexec/qsx-science-archive.py"
mode = "0755"
content = '''#!/usr/bin/env python3
"""Stream pinned inputs to Docker load in the guest; no network or extraction."""
import hashlib
import io
import json
from pathlib import Path
import sys
import tarfile

ROOT = Path("/mnt/qsx-build/artifacts")
MANIFEST = "fb96c7fb10d672f3be0d088399db3aeac52650416d1bb71f74f26429ea35778f"


def main():
    data = (ROOT / "sage-manifest.json").read_bytes()
    if hashlib.sha256(data).hexdigest() != MANIFEST:
        raise SystemExit("Sage manifest digest mismatch")
    manifest = json.loads(data)
    blobs = {item["digest"].split(":")[1] for item in [manifest["config"], *manifest["layers"]]}
    config_digest = manifest["config"]["digest"].split(":")[1]
    for digest in blobs:
        with (ROOT / ("sage-" + digest + ".blob")).open("rb") as stream:
            if hashlib.file_digest(stream, "sha256").hexdigest() != digest:
                raise SystemExit("Sage input digest mismatch: " + digest)
    compatible = json.dumps([{"Config": "blobs/sha256/" + config_digest,
                             "RepoTags": ["qsx/sagemath:10.8-fb96c7fb10d6"],
                             "Layers": ["blobs/sha256/" + x["digest"].split(":")[1]
                                        for x in manifest["layers"]]}]).encode()
    with tarfile.open(fileobj=sys.stdout.buffer, mode="w|") as archive:
        member = tarfile.TarInfo("manifest.json")
        member.size = len(compatible)
        member.mode = 0o644
        archive.addfile(member, io.BytesIO(compatible))
        for digest in sorted(blobs):
            source = ROOT / ("sage-" + digest + ".blob")
            member = tarfile.TarInfo("blobs/sha256/" + digest)
            member.mode = 0o644
            member.size = source.stat().st_size
            with source.open("rb") as stream:
                archive.addfile(member, stream)


if __name__ == "__main__":
    main()
'''

[[files]]
path = "/usr/local/libexec/qsx-science-prepare"
mode = "0755"
content = '''#!/bin/bash
set -euo pipefail
# All preparation runs only in the offline Alpine builder VM.
test "$(id -u)" = 0
mkdir -p /opt/lean-4.33.1
printf '%s  %s\n' 890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235 /mnt/qsx-build/artifacts/lean-4.33.1-linux.tar.zst | sha256sum -c -
tar --zstd -xf /mnt/qsx-build/artifacts/lean-4.33.1-linux.tar.zst -C /opt/lean-4.33.1 --strip-components=1 --no-same-owner --no-same-permissions
chown -R root:root /opt/lean-4.33.1
rc-update add cgroups boot
rc-service cgroups start
rc-update add docker default
rc-service docker start
for attempt in $(seq 1 60); do
    if docker info >/dev/null 2>&1; then break; fi
    sleep 1
done
docker info >/dev/null
[ "$(docker info --format '{{.Driver}}')" = overlay2 ]
/usr/local/libexec/qsx-science-archive.py | docker load
[ "$(docker image inspect --format '{{.Id}}' qsx/sagemath:10.8-fb96c7fb10d6)" = sha256:aeef59a8c17212357aeb83bd7f1cfac43bb1c789ae3fa2d887227c763bdfcac3 ]
for tool in sage lean lake; do ln -s /usr/local/libexec/qsx-science-client.py "/usr/local/bin/$tool"; done
rc-update add qsx-science default
rc-service qsx-science start
for attempt in $(seq 1 60); do
    if test -S /run/qsx-science/control.sock; then break; fi
    sleep 1
done
test -S /run/qsx-science/control.sock
# The agent never receives the guest Docker socket or docker group membership.
! id -nG agent | tr ' ' '\n' | grep -qx docker
'''

