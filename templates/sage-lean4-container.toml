# Separate container runtime; native candidate remains unchanged.
schema_version = 1
name = "sage-lean4-container"
description = "SageMath 10.8 and Lean 4.33.1 in a pinned glibc container inside Alpine; offline."
agent_profile = "../agent-profiles/codex.toml"
packages = ["docker", "docker-openrc", "python3", "zstd", "tar", "coreutils"]
prepare = ["/usr/local/libexec/qsx-science-prepare"]
readiness = [
  "sage -python -c 'import os; from sage.all import ZZ, GF, matrix; assert os.geteuid() != 0; assert matrix(ZZ, [[2,3],[5,7]]).det() == -1; assert GF(7)(3)**6 == 1; print(\"SAGE_EXACT_PASS\")'",
  "/usr/local/libexec/qsx-science-check",
]

[resources]
memory_mib = 4096
vcpus = 4
disk_gib = 32

