path = "/usr/local/libexec/qsx-science-service.py"
mode = "0755"
content = '''#!/usr/bin/env python3
"""Guest-only, fixed Docker execution service. Never expose the Docker API."""
from __future__ import annotations
import base64
import json
import os
from pathlib import Path
import pwd
import socket
import struct
import subprocess
import threading

SOCKET = "/run/qsx-science/control.sock"
WORKSPACE = Path("/workspace/project")
IMAGE_ID = "sha256:aeef59a8c17212357aeb83bd7f1cfac43bb1c789ae3fa2d887227c763bdfcac3"
TOOLS = {"sage": "/usr/bin/sage", "lean": "/opt/lean-4.33.1/bin/lean",
         "lake": "/opt/lean-4.33.1/bin/lake"}


def command(request, uid, gid):
    if not isinstance(request, dict) or set(request) != {"tool", "argv", "cwd"}:
        raise ValueError("request requires exactly tool, argv, cwd")
    if request["tool"] not in TOOLS:
        raise ValueError("unsupported science tool")
    args = request["argv"]
    if (not isinstance(args, list) or len(args) > 512
            or any(not isinstance(arg, str) or "\0" in arg for arg in args)):
        raise ValueError("invalid tool arguments")
    if not isinstance(request["cwd"], str) or not Path(request["cwd"]).is_absolute():
        raise ValueError("cwd must be absolute")
    if WORKSPACE.is_symlink() or WORKSPACE.resolve() != WORKSPACE:
        raise ValueError("workspace root must not be redirected")
    cwd = Path(request["cwd"]).resolve(strict=True)
    if not cwd.is_dir() or not cwd.is_relative_to(WORKSPACE):
        raise ValueError("cwd must belong to the guest workspace")
    if uid == 0 or gid == 0:
        raise ValueError("root tool identity forbidden")
    return ["/usr/bin/docker", "run", "--rm", "--pull=never", "--network=none",
            "--name=qsx-science-job", "--read-only", "--cap-drop=ALL", "--security-opt=no-new-privileges:true",
            "--pids-limit=256", "--memory=3g", "--memory-swap=3g", "--cpus=4",
            "--user=" + str(uid) + ":" + str(gid), "--workdir=" + str(cwd),
            "--mount=type=bind,source=/workspace/project,target=/workspace/project",
            "--mount=type=bind,source=/opt/lean-4.33.1,target=/opt/lean-4.33.1,readonly",
            "--tmpfs=/tmp:rw,nosuid,nodev,size=1g,mode=1777",
            "--env=HOME=/tmp", "--env=DOT_SAGE=/tmp/.sage",
            "--env=PATH=/opt/lean-4.33.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
            "--entrypoint=" + TOOLS[request["tool"]], IMAGE_ID, *args]


def send(stream, value):
    stream.write(json.dumps(value).encode() + b"\n")
    stream.flush()


def handle(connection, agent):
    with connection:
        connection.settimeout(650)
        with connection.makefile("rwb") as stream:
            process = None
            timer = None
            try:
                _, peer_uid, _ = struct.unpack("3i", connection.getsockopt(
                    socket.SOL_SOCKET, socket.SO_PEERCRED, struct.calcsize("3i")))
                if peer_uid != agent.pw_uid:
                    raise ValueError("only the guest agent may request tools")
                line = stream.readline(65537)
                if len(line) > 65536 or not line.endswith(b"\n"):
                    raise ValueError("request is too large or incomplete")
                argv = command(json.loads(line), agent.pw_uid, agent.pw_gid)
                process = subprocess.Popen(argv, stdin=subprocess.DEVNULL,
                                           stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                # Remove the container even if its program ignores SIGTERM.
                def stop():
                    subprocess.run(["/usr/bin/docker", "rm", "--force", "qsx-science-job"],
                                   stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                   check=False, timeout=15)
                    if process.poll() is None:
                        process.terminate()
                timer = threading.Timer(600, stop)
                timer.start()
                produced = 0
                while block := process.stdout.read1(16384):
                    produced += len(block)
                    if produced > 32 * 1024 * 1024:
                        process.terminate()
                        raise ValueError("tool output exceeded 32 MiB")
                    send(stream, {"output": base64.b64encode(block).decode()})
                send(stream, {"exit_code": process.wait()})
            except (OSError, ValueError, TypeError, KeyError) as error:
                try:
                    send(stream, {"error": str(error), "exit_code": 125})
                except OSError:
                    pass
            finally:
                if timer is not None:
                    timer.cancel()
                if process is not None and process.poll() is None:
                    process.terminate()
                    try:
                        process.wait(timeout=10)
                    except subprocess.TimeoutExpired:
                        process.kill()
                        process.wait()
                if process is not None:
                    subprocess.run(["/usr/bin/docker", "rm", "--force", "qsx-science-job"],
                                   stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                   check=False, timeout=15)


def main():
    if os.geteuid() != 0:
        raise SystemExit("this fixed guest service runs as root")
    agent = pwd.getpwnam("agent")
    subprocess.run(["/usr/bin/docker", "rm", "--force", "qsx-science-job"],
                   stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                   check=False, timeout=15)
    parent = Path(SOCKET).parent
    parent.mkdir(mode=0o755, exist_ok=True)
    path = Path(SOCKET)
    if path.exists() or path.is_symlink():
        path.unlink()
    with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as server:
        server.bind(SOCKET)
        os.chown(SOCKET, 0, agent.pw_gid)
        os.chmod(SOCKET, 0o660)
        server.listen(8)
        # Serialize tool execution to preserve the declared 3 GiB memory budget.
        while True:
            connection, _ = server.accept()
            handle(connection, agent)


if __name__ == "__main__":
    main()
'''

