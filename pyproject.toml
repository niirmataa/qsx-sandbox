[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qsx"
version = "0.1.0"
description = "Conservative controller for the QSX single-VM workspace"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
qsx = "qsx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["qsx"]
