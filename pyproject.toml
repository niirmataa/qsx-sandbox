[build-system]
requires = []
build-backend = "qsx_build"
backend-path = ["build_backend"]

[project]
name = "qsx"
version = "0.1.0"
description = "Conservative controller for the QSX single-VM workspace"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
qsx = "qsx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["qsx"]
